name: generated-index

on:
  pull_request:
  push:
    branches: [main, zh]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-index-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # main 使用英文仓库 chrome，zh 使用中文仓库 chrome。
      # PR 按目标分支决定语言，避免贡献分支的默认值改变发布语义。
      SKILL_LANG: ${{ (github.base_ref == 'zh' || github.ref_name == 'zh') && 'zh' || 'en' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify index and brand regression tests
        run: npm test
      - name: Validate and regenerate all indexes
        run: node scripts/check-generated.mjs --lang="$SKILL_LANG"
